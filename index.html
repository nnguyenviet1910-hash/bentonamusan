['寒い là phi quá khứ; 昨日 yêu cầu quá khứ 寒かった.','寒くて là dạng nối, không thể kết thúc bằng 寒くてです.','寒くない là phủ định phi quá khứ, không diễn đạt hôm qua trời lạnh.'],
['まで nghĩa là đến mốc nào đó, không đánh dấu đối tượng so sánh.','から chỉ điểm bắt đầu hoặc lý do; không thay cho より trong mẫu so sánh này.','を đánh dấu tân ngữ; không dùng làm mốc so sánh.'],
['だ là phi quá khứ, không phù hợp với 昨日.','です là phi quá khứ lịch sự; đề yêu cầu quá khứ thể thường.','じゃない là phủ định phi quá khứ; đề yêu cầu khẳng định quá khứ.'],
['から diễn đạt lý do; đề muốn đối lập khó nhưng vui.','まで chỉ giới hạn, không nối hai nhận xét theo nghĩa nhưng.','より dùng so sánh, không phải liên từ tương phản.'],
['います dùng cho người và động vật; 本 là đồ vật.','です không tạo câu tồn tại với cấu trúc 場所に本が ở đây.','でした là quá khứ của です; câu này cần động từ tồn tại cho đồ vật.'],
['あります dùng cho đồ vật, không dùng cho 子供 là người.','でした không phù hợp với cấu trúc địa điểm に + người が + động từ tồn tại.','じゃない không phải động từ diễn đạt có người ở một nơi.'],
['学生 là người nên dùng います, không dùng あります.','二人です dùng để nói là hai người; ở đây cấu trúc に学生が cần động từ tồn tại.','でした không hoàn thành mẫu nêu số người đang có trong lớp.'],

['を có thể chỉ đường đi qua trong mẫu khác; 日本 ở đây là đích đến.','で chỉ địa điểm hành động hoặc phương tiện, không phải đích của 行きます.','と dùng chỉ người đồng hành hoặc liệt kê, không đánh dấu đích đến.'],
['に dùng cho nơi tồn tại hoặc đích đến; 読みます diễn ra tại thư viện nên cần で.','を đánh dấu đối tượng được đọc (本), không phải nơi đọc.','へ chỉ hướng di chuyển; 読みます không phải động từ di chuyển.'],
['誰か là ai đó; đề muốn diễn đạt không có ai bằng 誰も + phủ định.','誰を không phù hợp vì います là động từ tồn tại, không nhận tân ngữ を.','へ đánh dấu hướng di chuyển; không ghép với 誰 để diễn đạt không ai.'],

function correction(q,choice){
  if(q.type==='grammar'){
    const canonical=LESSONS[q.lesson-1].question;
    const i=canonical.options.slice(1).indexOf(choice);
    return {why:GRAMMAR_ERRORS[q.lesson-1]?.[i]||`「${choice}」không phù hợp với yêu cầu của câu này. Hãy đối chiếu cấu trúc và ví dụ dưới đây.`,knowledge:canonical.explain,translation:canonical.translation};
  }
  if(q.type==='vocab'){
    const v=q.vocab||allV.find(v=>q.id.startsWith(v.id+'-'));
    const field=q.id.split('-').at(-1),names={kana:'cách đọc kana',romaji:'phiên âm romaji',meaning:'nghĩa tiếng Việt',word:'cách viết chữ Nhật'};
    const other=allV.find(x=>x[field]===choice&&x[field]!==v[field]);
    return {why:`Bạn đã nhầm ${names[field]} của 「${v.word}」.${other?` Đáp án 「${choice}」 thuộc mục từ ${other.word} (${other.kana} / ${other.romaji}): ${other.meaning}.`:''} Đáp án cần chọn ở câu này là 「${v[field]}」.`,knowledge:`${v.word} · ${v.kana} · ${v.romaji} · ${v.meaning}`,vocab:v};
  }
  const k=allK.find(k=>q.id.startsWith(k.id+'-'));
  const field=q.id.endsWith('-meaning')?'meaning':'word';
  const other=allK.find(x=>x[field]===choice);
  return {why:`Bạn đã ghép nhầm chữ Hán với nghĩa.${other?` 「${other.word}」 mang nghĩa “${other.meaning}”.`:''} Câu này cần 「${k.word}」 — ${k.meaning}.`,knowledge:`Ghi nhớ: ${k.word} = ${k.meaning}. Một chữ Hán có thể có nhiều cách đọc; hãy học cách đọc trong từng từ cụ thể.`};
}
function feedbackHTML(q,a){
  const f=a.correct?{knowledge:q.explain,translation:q.translation,vocab:q.vocab}:correction(q,a.choice);
  return `<section class="feedback ${a.correct?'':'bad'}" role="status"><h3>${a.correct?'✓ Chính xác!':'Chưa đúng — xem lại điểm nhầm'}</h3>${!a.correct?`<div class="answer-compare"><div><small>Bạn đã chọn</small><strong>${esc(a.choice)}</strong></div><div><small>Đáp án đúng</small><strong>${esc(q.answer)}</strong></div></div><h4>Vì sao đáp án bạn chọn chưa đúng?</h4><p>${esc(f.why)}</p>`:`<p>Đáp án: <strong>${esc(q.answer)}</strong></p>`}<h4>Kiến thức cần nhớ</h4><div>${esc(f.knowledge)}</div>${f.translation?`<div class="example"><strong>Nghĩa của ví dụ đúng</strong><br>${esc(f.translation)}</div>`:''}${f.vocab?`<div class="example"><strong>Đối chiếu đủ bốn dạng</strong><br><span class="jp">${esc(f.vocab.word)} · ${esc(f.vocab.kana)}</span><small>Romaji: ${esc(f.vocab.romaji)}<br>Nghĩa: ${esc(f.vocab.meaning)}</small></div>`:''}<p><a class="source" href="#lesson/${q.lesson}">Ôn lại kiến thức buổi ${q.lesson} →</a></p></section>`;
}

function filterLessons(){const q=$('#lessonSearch').value.toLowerCase(),c=$('#chapterFilter').value;const ls=LESSONS.filter(l=>(!c||l.chapter==c)&&JSON.stringify(l.grammar).concat(l.title).toLowerCase().includes(q));$('#lessonGrid').innerHTML=ls.length?ls.map(l=>`<a class="card lesson-card" href="#lesson/${l.id}"><div class="section-head"><span class="eyebrow">BUỔI ${String(l.id).padStart(2,'0')}</span><span class="badge">${state.done.includes(l.id)?'✓ Hoàn thành':`Chương ${l.chapter}${l.part}`}</span></div><h3>${l.title}</h3><p>${l.grammar.map(g=>esc(g.pattern)).join(' · ')}</p><div class="line"></div><div class="section-head" style="margin:0"><small class="muted">Ôn tích lũy buổi 1–${l.id}</small><span>→</span></div></a>`).join(''):`<div class="empty">Không tìm thấy bài học phù hợp.</div>`}

function vocab(){ $('#app').innerHTML=head('Sổ tay từ vựng','164 mục từ trọng tâm · chữ Nhật, kana, romaji và nghĩa tiếng Việt.')+`<div class="filters"><input id="vocabSearch" placeholder="Tìm bằng tiếng Việt, chữ Nhật hoặc romaji…" aria-label="Tìm từ vựng"><select id="vocabScope" aria-label="Phạm vi từ vựng"><option value="all">Tất cả từ vựng</option><option value="star">Từ đã lưu</option>${LESSONS.map(l=>`<option value="${l.id}">Buổi ${l.id} · ${l.chapter}${l.part}</option>`).join('')}</select></div><div class="card" id="vocabList"></div>`;$('#vocabSearch').oninput=filterVocab;$('#vocabScope').onchange=filterVocab;filterVocab()}

function review(id){id=Number(id)||nextLesson().id;let count=bank(id).length;$('#app').innerHTML=head('Ôn lại để nhớ lâu hơn','Trắc nghiệm 4 đáp án · Xáo trộn câu hỏi và đáp án mỗi lượt.')+`<div class="cols"><div class="card"><span class="eyebrow">THIẾT LẬP BUỔI ÔN</span><h2 style="margin:15px 0">Hôm nay bạn học đến đâu?</h2><select id="reviewMax" style="width:100%" aria-label="Ôn đến buổi">${LESSONS.map(l=>`<option value="${l.id}" ${l.id===id?'selected':''}>Buổi ${l.id} · ${l.chapter}${l.part} — ${l.title}</option>`).join('')}</select><div class="callout">Phạm vi: <strong>buổi 1–${id}</strong><br>Ngân hàng: ${count} câu, gồm từ vựng, ngữ pháp và chữ Hán.</div><label for="reviewMode">Chọn cách ôn</label><select id="reviewMode" style="width:100%;margin:12px 0"><option value="full">Ôn đầy đủ — ${count} câu trong phạm vi</option><option value="quick">Ôn nhanh — mỗi buổi 1 câu mỗi dạng</option><option value="today">Chỉ kiến thức mới của buổi ${id}</option></select><p class="note">Ôn đầy đủ bao gồm mọi câu trong ngân hàng từ buổi 1 đến buổi chọn. Ôn nhanh chỉ lấy mẫu đại diện, không thay thế lượt đầy đủ.</p><button class="btn" style="width:100%" onclick="startQuiz(${id},$('#reviewMode').value)">Bắt đầu lượt ôn →</button>${savedQuiz&&savedQuiz.index<savedQuiz.questions.length?`<button class="btn light" style="width:100%;margin-top:10px" onclick="resumeQuiz()">Tiếp tục lượt đang làm (${savedQuiz.index+1}/${savedQuiz.questions.length})</button>`:''}</div><div><div class="card review-card"><span class="eyebrow">NHỚ ĐỦ MỌI DẠNG</span><h2 style="margin:22px 0;line-height:1.7">学生 → がくせい<br>gakusei → sinh viên</h2><p>Từ vựng đổi hướng hỏi giữa cách viết, cách đọc kana, romaji và nghĩa. Từ vay mượn giữ katakana chuẩn.</p><div class="line"></div><p>Ngữ pháp có ví dụ và bản dịch sau mỗi câu. Làm lại bài để đảo thứ tự câu hỏi và vị trí đáp án.</p><a href="#mistakes" class="textlink">Luyện ${state.wrong.length} câu còn nhầm →</a></div></div></div>`;$('#reviewMax').onchange=e=>{locati function startQuiz(max,mode='full'){let pool=bank(max);if(mode==='today')pool=pool.filter(q=>q.lesson===max);if(mode==='wrong')pool=pool.filter(q=>state.wrong.includes(q.id));if(mode==='quick')pool=LESSONS.filter(l=>l.id<=max).flatMap(l=>['vocab','grammar','kanji'].flatMap(t=>shuffle(pool.filter(q=>q.lesson===l.id&&q.type===t)).slice(0,1)));if(!pool.length){toast('Chưa có câu cần luyện trong phạm vi này.');return}session={max,mode,index:0,score:0,questions:shuffle(pool).map(q=>({...q,options:shuffle(q.options)})),answers:[],started:Date.now()};saveQuiz();location.hash='quiz';quiz()}

function appearance(key,value){state.ui[key]=value;save();applyAppearance();nav()}
nav=function(){const routeName=location.hash.slice(1).split('/')[0]||'home';const active=routeName==='lesson'?'lessons':routeName;const links=[['home','Trang chủ'],['lessons','Lộ trình'],['review','Ôn tập'],['mistakes','Câu sai']];$('header').innerHTML=`<a class="blue-brand" href="#home"><span class="brand-mark">日</span><span>Nihongo<span class="brand-dot">.</span><small>HỌC ĐỀU · NHỚ LÂU</small></span></a><nav class="top-links" aria-label="Điều hướng chính">${links.map(([r,t])=>`<a class="${active===r?'active':''}" href="#${r}">${t}</a>`).join('')}</nav><div class="top-tools"><div class="font-tools" aria-label="Cỡ chữ">${['s','m','l'].map(v=>`<button aria-label="Cỡ chữ ${v==='s'?'nhỏ':v==='m'?'vừa':'lớn'}" aria-pressed="${state.ui.size===v}" onclick="appearance('size','${v}')">${v.toUpperCase()}</button>`).join('')}</div><button class="theme-toggle" aria-label="Đổi giao diện sáng tối" onclick="appearance('theme','${state.ui.theme==='dark'?'light':'dark'}')">${state.ui.theme==='dark'?'☀':'☾'}</button><a class="profile-link" href="#settings">Hồ sơ học tập ↗</a></div>`;$('#mobileNav').innerHTML=navs.map(([r,i,t])=>`<a href="#${r}" class="${active===r?'active':''}"><span class="ico">${i}</span>${t}</a>`).join('')};
home=function(){const l=nextLesson(),g=growth(),today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7);$('#app').innerHTML=`<section class="blue-hero"><div class="hero-copy"><span class="eyebrow">KHÔNG GIAN TỰ HỌC TIẾNG NHẬT</span><h1>Học theo từng buổi,<br><em>nhớ qua từng lần ôn.</em></h1><p>Mỗi bài mới nối tiếp kiến thức cũ.<br>Một hành trình nhỏ, một nền tảng vững vàng.</p><a class="btn" href="#lesson/${l.id}">Tiếp tục buổi ${l.id} <span>↗</span></a><div class="hero-numbers"><div><strong>41</strong><span>buổi học</span></div><div><strong>1.019</strong><span>câu ôn tập</span></div><div><strong>N5</strong><span>GUNGUN JOUTATSU</span></div></div></div><div class="study-art" aria-hidden="true"><div class="orbit o1"></div><div class="orbit o2"></div><span class="art-star">✧</span><div class="word-ticket ticket-a"><small>KANJI</small><b>学</b><span>がく · học</span></div><div class="word-ticket ticket-b"><small>MỖI NGÀY</small><b>毎日</b><span>まいにち</span></div><div class="book book-a">にほんご</div><div class="book book-b"></div><div class="book book-c"></div><span class="floating-tag">✦ Tích lũy từng chút</span></div></section><section class="growth-panel"><div class="growth-info"><span class="eyebrow">KHU VƯỜN KIẾN THỨC</span><h2>${g.name}<span class="xp-chip">✦ ${xp().toLocaleString('vi-VN')} XP</span></h2><p>Mỗi câu trả lời đúng lần đầu giúp cây lớn thêm. Ôn lại để kiến thức bén rễ.</p><div class="growth-track"><div class="section-head"><strong>${g.next?`Còn ${g.next-xp()} XP để đạt ${g.names[g.stage+1]}`:'Cây đã đơm hoa. Tiếp tục chăm sóc bằng việc ôn tập!'}</strong><span>${g.progress}%</span></div><div class="progress"><i style="width:${g.progress}%"></i></div><div class="growth-stages">${g.names.map((n,i)=>`<div class="${i<=g.stage?'reached':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${n}</span></div>`).join('')}</div></div><p class="note">+10 XP cho mỗi câu mới trả lời đúng · Làm lại vẫn giúp ôn nhớ, không cộng XP trùng.</p></div>${plant(g.stage)}<div class="streak-panel"><div><strong>✧ ${streakCount()} ngày học liên tiếp</strong><p>Trả lời ít nhất một câu mỗi ngày để duy trì nhịp học.</p></div><div class="week-days">${Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);const done=state.studyDays.includes(dayKey(d));return `<div class="${done?'studied':''} ${dayKey(d)===dayKey(today)?'today':''}"><span>${['T2','T3','T4','T5','T6','T7','CN'][i]}</span><b>${done?'✓':'·'}</b></div>`}).join('')}</div></div></section><section class="track-section"><div class="section-head"><div><span class="eyebrow">CHỌN NỘI DUNG HỌC</span><h2>Hôm nay, bạn muốn học gì?</h2></div><a class="textlink" href="#lessons">Xem lộ trình ↗</a></div><div class="grid learning-tracks"><a class="card" href="#lessons"><div class="track-art"><span>は</span><b>＋</b><span>です</span></div><h3>Ngữ pháp theo từng buổi ↗</h3><p>148 điểm ngữ pháp, từ giới thiệu bản thân đến diễn đạt điều kiện. Học lý thuyết rồi áp dụng qua bài tập.</p><small>41 buổi · 14 chương</small></a><a class="card" href="#vocab"><div class="track-art"><span>学生<small>がくせい</small></span><b>↔</b><span>Aa</span></div><h3>Từ vựng & thẻ ghi nhớ ↗</h3><p>Đối chiếu chữ Nhật, kana, romaji và nghĩa Việt. Đổi hướng câu hỏi để nhớ từ theo nhiều cách.</p><small>164 mục từ trọng tâm</small></a><a class="card" href="#review/${l.id}"><div class="track-art"><span>一</span><span>学</span><span>日</span></div><h3>Ôn tập tích lũy ↗</h3><p>Kết hợp từ vựng, ngữ pháp và 161 chữ Hán. Buổi sau ôn toàn bộ buổi trước cùng bài hôm nay.</p><small>4 đáp án · Giải thích từng lỗi sai</small></a></div></section><section class="bottom-banner"><div><span class="eyebrow">MỖI NGÀY MỘT BƯỚC</span><h2>Bắt đầu nhỏ.<br>Tiến bộ thật lâu.</h2></div><a class="btn" href="#review/${l.id}">Bắt đầu ôn tập →</a></section>`};
function lessonStars(id){const best=Math.max(0,...state.history.filter(h=>h.max===id&&h.mode==='today').map(h=>h.score/h.total));return best>=.95?3:best>=.8?2:best>=.6?1:0}
lessons=function(){$('#app').innerHTML=head('Lộ trình tiếng Nhật N5','14 chương · 41 buổi học nối tiếp · Ôn tích lũy từ buổi đầu tiên')+`<div class="roadmap-layout"><section class="chapter-menu"><span class="eyebrow">LỘ TRÌNH GUNGUN</span><h2>Chọn chặng học</h2><p class="muted mini">Mỗi phần A, B, C, D là một buổi.</p><div class="chapter-list">${Array.from({length:14},(_,i)=>{const ls=LESSONS.filter(l=>l.chapter===i+1),done=ls.filter(l=>state.done.includes(l.id)).length;return `<button class="chapter-btn ${selectedChapter===i+1?'active':''}" onclick="selectedChapter=${i+1};lessons()"><b>${String(i+1).padStart(2,'0')}</b><span>Chương ${i+1}<small>${done}/${ls.length} buổi đã học</small></span><span>›</span></button>`}).join('')}</div></section><section><div class="chapter-intro"><span class="eyebrow">CHƯƠNG ${String(selectedChapter).padStart(2,'0')}</span><h2>${LESSONS.find(l=>l.chapter===selectedChapter).title}</h2><p>Học lý thuyết, làm bài mới và quay lại ôn toàn bộ kiến thức đã học.</p><a class="btn light" href="#review/${LESSONS.filter(l=>l.chapter===selectedChapter).at(-1).id}">Ôn tích lũy đến cuối chương →</a></div><div class="roadmap-lessons">${LESSONS.filter(l=>l.chapter===selectedChapter).map(l=>`<div class="road-step"><div class="road-node ${state.done.includes(l.id)?'done':''}"><b>${String(l.id).padStart(2,'0')}</b><span aria-label="${lessonStars(l.id)} trên 3 sao">${'★'.repeat(lessonStars(l.id))}${'☆'.repeat(3-lessonStars(l.id))}</span></div><article class="card road-card"><div class="eyebrow">PHẦN ${l.part} · BUỔI ${l.id}</div><h3>${l.title}</h3><p>${l.grammar.length} điểm ngữ pháp · ${l.vocab.length} từ vựng · ${l.kanji.length} chữ Hán</p><div class="actions"><a class="btn light" href="#lesson/${l.id}">Học lý thuyết</a><button class="btn" onclick="startQuiz(${l.id},'today')">Luyện bài này →</button></div></article></div>`).join('')}</div><div class="callout">Sao dựa trên điểm cao nhất khi luyện riêng bài: 60% = 1★, 80% = 2★, 95% = 3★. Các bài luôn mở để bạn tự chọn nhịp học.</div><div class="actions">${selectedChapter>1?`<button class="btn light" onclick="selectedChapter--;lessons()">← Chương trước</button>`:''}${selectedChapter<14?`<button class="btn light" onclick="selectedChapter++;lessons()">Chương tiếp →</button>`:''}</div></section></div>`};
const originalAnswer=answer;answer=function(i){if(!session||session.answers[session.index])return;const q=session.questions[session.index];if(i<0||i>=q.options.length)return;recordStudy();if(q.options[i]===q.answer&&!state.mastered.includes(q.id)){state.mastered.push(q.id);save()}originalAnswer(i)};
const originalSettings=settings;settings=function(){originalSettings();$('#app').insertAdjacentHTML('afterbegin',`<div class="callout"><strong>Hồ sơ trên thiết bị này · ${xp()} XP · ${streakCount()} ngày liên tiếp</strong><br>XP tính từ những câu mới trả lời đúng kể từ khi dùng bản nâng cấp. Không có đăng nhập hay đồng bộ đám mây trong bản này.</div>`)};
applyAppearance();route();
</script></body></html>
